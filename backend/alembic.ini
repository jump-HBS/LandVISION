# Alembic configuration (LandVISION DB migrations)
# Usage:
#   cd backend
#   alembic upgrade head --sql          # offline SQL preview (no DB connection needed)
#   alembic upgrade head                # apply to database
#   alembic revision --autogenerate -m "message"   # generate migration from model changes
#   alembic downgrade -1                # rollback one revision

[alembic]
script_location = migrations
prepend_sys_path = .
# DB URL is resolved by migrations/env.py from app config (LANDVISION_DB_URL)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
